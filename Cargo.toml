[package]
name = "name-match-mcp"
version = "0.3.0"
edition = "2024"
description = "stdio MCP server that matches target names against a reference name set"
license = "MIT"

[lib]
name = "name_match_mcp"
path = "src/lib.rs"

[[bin]]
name = "name-match-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
rayon = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
