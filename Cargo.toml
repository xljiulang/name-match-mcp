[package]
name = "name-match"
version = "0.5.0"
edition = "2024"
description = "CLI that matches one worksheet column against a reference column of the same xlsx workbook and writes the results back"
license = "MIT"

[lib]
name = "name_match"
path = "src/lib.rs"

[[bin]]
name = "name-match"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
